name: Publish to NPM and GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED="v${PKG_VERSION}"
          echo "Tag: ${TAG}"
          echo "Expected: ${EXPECTED}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Git tag '$TAG' does not match package version '$EXPECTED'. Aborting release."
            exit 1
          fi

  npm-publish:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run build

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: npm-publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # publish-release.sh builds the TypeScript, frontend, and pkg binaries.
      # A fresh GitHub runner has no node_modules until dependencies are installed.
      - run: npm ci

      - name: Build binaries and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # publish-release.sh owns the binary naming (okit-${TAG}-macos-{arch}.zip)
          # and uploads both macOS assets, so CI and manual runs never drift.
          scripts/publish-release.sh "$TAG" --auto-notes
